[project]
name = "tilik-api"
version = "0.1.0"
description = "TILIK API: rule engine dan analisis caption/visual"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
