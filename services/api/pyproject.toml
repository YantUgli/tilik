[project]
name = "tilik-api"
version = "0.1.0"
description = "TILIK API: rule engine dan analisis caption/visual"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "pydantic>=2",
    "pyyaml>=6",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pytest>=8",
]

# FastAPI Cloud (`fastapi deploy`) membaca pyproject.toml + uv.lock; Dockerfile diabaikan.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: memanggil provider sungguhan (butuh FIREWORKS_EVAL_API_KEY); dilewati default"]
