[project]
name = "tilik-api"
version = "0.1.0"
description = "TILIK API: rule engine dan analisis caption/visual"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyyaml>=6",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
