# Kalimat isi naskah dinas militer fiktif. Ditulis kalimat biasa; template ST
# mengubahnya menjadi huruf kapital (dan gaya TTK/KMA untuk st-b, st-c).
kegiatan:
  latihan:
    - judul: latihan kesegaran jasmani berkala semester II
      kalimat:
        - Dalam rangka menjaga kondisi fisik personel, satuan melaksanakan latihan kesegaran jasmani berkala semester II.
        - Seluruh personel agar mengikuti tes kesegaran jasmani sesuai jadwal yang ditentukan oleh bagian latihan.
        - Personel yang berhalangan karena sakit agar melampirkan surat keterangan dari petugas kesehatan satuan.
    - judul: latihan menembak senjata ringan triwulan IV
      kalimat:
        - Latihan menembak senjata ringan triwulan IV dilaksanakan untuk mempertahankan kemampuan dasar keprajuritan.
        - Bagian logistik agar menyiapkan sasaran latihan, alat keselamatan, dan daftar hadir peserta.
        - Hasil latihan dilaporkan secara tertulis paling lambat tujuh hari setelah kegiatan selesai.
    - judul: latihan penanggulangan bencana alam
      kalimat:
        - Satuan menyelenggarakan latihan penanggulangan bencana alam bersama relawan dan perangkat kelurahan.
        - Materi latihan meliputi evakuasi warga, pertolongan pertama, dan pendirian dapur umum.
        - Komandan regu agar memastikan kelengkapan perorangan sesuai daftar periksa latihan.
  administrasi:
    - judul: pemutakhiran data personel
      kalimat:
        - Dalam rangka tertib administrasi, setiap subsatuan agar memutakhirkan data personel dan keluarga.
        - Formulir yang telah diisi dikumpulkan kepada bagian personalia dalam bentuk cetak dan berkas digital.
        - Data yang dikirimkan agar diperiksa kembali kebenarannya oleh perwira seksi personel.
    - judul: inventarisasi barang milik negara
      kalimat:
        - Setiap subsatuan agar melaksanakan inventarisasi barang milik negara yang berada di lingkungan kerjanya.
        - Barang dalam kondisi rusak berat agar dicatat tersendiri untuk diusulkan penghapusannya.
        - Laporan inventarisasi ditandatangani kepala subsatuan dan diserahkan kepada bagian logistik.
    - judul: penertiban arsip dan surat menyurat
      kalimat:
        - Untuk mendukung tertib administrasi, seluruh bagian agar menata arsip surat masuk dan surat keluar.
        - Arsip yang telah melewati masa simpan agar didata untuk diusulkan pemusnahannya sesuai ketentuan.
        - Petugas tata usaha agar mengikuti pembekalan pengelolaan arsip yang diselenggarakan bagian umum.
    - judul: pengajuan kebutuhan alat tulis kantor
      kalimat:
        - Setiap bagian agar mengajukan kebutuhan alat tulis kantor untuk satu semester ke depan.
        - Pengajuan disusun menggunakan format yang telah ditentukan dan ditandatangani kepala bagian.
        - Bagian keuangan akan merekapitulasi seluruh pengajuan sebelum dilakukan pengadaan.
  sosial:
    - judul: kegiatan donor darah dalam rangka hari jadi satuan
      kalimat:
        - Dalam rangka hari jadi satuan, diselenggarakan kegiatan donor darah bekerja sama dengan unit transfusi darah setempat.
        - Personel dan keluarga yang memenuhi syarat kesehatan dapat mendaftar melalui petugas kesehatan satuan.
        - Panitia agar menyiapkan tempat, konsumsi ringan, dan petugas pendaftaran.
    - judul: kerja bakti pembersihan saluran air
      kalimat:
        - Menjelang musim hujan, satuan melaksanakan kerja bakti pembersihan saluran air bersama warga sekitar.
        - Setiap subsatuan agar mengirimkan personel dengan membawa alat kebersihan masing-masing.
        - Kegiatan dikoordinasikan dengan perangkat kelurahan dan ketua lingkungan setempat.
    - judul: bakti sosial pengobatan gratis
      kalimat:
        - Satuan menyelenggarakan bakti sosial pengobatan gratis bagi masyarakat di wilayah binaan.
        - Petugas kesehatan satuan agar menyiapkan obat-obatan umum dan alat pemeriksaan sederhana.
        - Pelaksanaan kegiatan dilaporkan beserta jumlah warga yang dilayani.
    - judul: penanaman pohon di lingkungan asrama
      kalimat:
        - Dalam rangka penghijauan, satuan melaksanakan penanaman pohon di lingkungan asrama dan kantor.
        - Bibit pohon disediakan oleh bagian logistik dan dibagikan kepada setiap subsatuan.
        - Setiap subsatuan bertanggung jawab merawat pohon yang ditanam di wilayahnya.

penutup_st:
  - Demikian untuk dilaksanakan dan dilaporkan.
  - Demikian untuk menjadi perhatian dan dilaksanakan.
  - Demikian untuk diketahui dan dipedomani.

penutup_surat:
  - Demikian untuk menjadi maklum.
  - Demikian disampaikan, atas perhatiannya diucapkan terima kasih.
  - Demikian untuk dilaksanakan dengan penuh tanggung jawab.

