  korps_yonif: [INFANTERI, INFANTERI MEKANIS, ZENI TEMPUR, ARTILERI MEDAN]

pejabat:
  nama_depan: [ADI, BAGAS, CAHYO, DIMAS, FAJAR, GILANG, HARIS, IRVAN, LUTFI, NANDA, RAKA, SATRIA, TEGAR, WAHYU, YOGA]
  nama_belakang: [CONTOHARJO, FIKTIADI, PERAGANTO, SIMULANTO, MAKETONO, PURWARUPANTO, SAMPELWANTO, CONTOHWIBOWO]
  pangkat_perwira: [LETTU, KAPTEN, MAYOR, LETKOL, KOLONEL]
