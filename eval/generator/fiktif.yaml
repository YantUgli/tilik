# Bank data FIKTIF untuk generator dokumen sintetis (T-29).
#
# - Semua nama satuan, pejabat, nomor, alamat, dan instansi di sini dikarang.
#   Nomor satuan sengaja memakai blok 99x/99xx dan angka romawi Kodam >= XXXI,
#   yang tidak dipakai satuan nyata. Nama satuan diberi akhiran yang jelas fiktif.
# - Isi kalimat netral (latihan, administrasi, kegiatan sosial). Tidak ada kalimat
#   yang disalin dari Surat Telegram asli yang diberitakan media.
# - eval/tests/test_generator.py::test_no_real_units memindai file ini terhadap
#   daftar_hitam.txt.

